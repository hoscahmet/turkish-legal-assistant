[project]
name = "turkish-legal-assistant"
version = "0.1.0"
description = "Question answering over Turkish legislation"
readme = "README.md"
authors = [
    { name = "Ahmet Hoşca", email = "hoscahmet@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "flagembedding>=1.4.2",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.19",
    "mcp>=2.3.0",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
finetune = [
    "bitsandbytes>=0.50.2",
    "peft>=0.21.2",
    "trl>=1.17.1",
    "vllm>=0.22.1",
]

[tool.uv]
# vLLM is only needed to generate data and serve the fine-tuned model; Docker can skip it with --no-group finetune.
default-groups = ["dev", "finetune"]
