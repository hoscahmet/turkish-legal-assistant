[project]
name = "turkish-legal-assistant"
version = "0.1.0"
description = "Question answering over Turkish legislation"
readme = "README.md"
authors = [
    { name = "Ahmet Hoşca", email = "hoscahmet@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
